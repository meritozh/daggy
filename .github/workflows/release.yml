name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: macOS arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --release -p daggy-app

      - name: Bundle
        run: ./scripts/make-bundle.sh

      - name: Zip app
        run: |
          cd target/release
          ditto -c -k --keepParent daggy.app daggy-macos-arm64.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: target/release/daggy-macos-arm64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
